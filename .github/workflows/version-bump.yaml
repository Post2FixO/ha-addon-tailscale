---
name: Version bump

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Check for a newer Tailscale release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare pinned version against latest upstream release
        id: check
        run: |
          set -euo pipefail

          current=$(grep -oP '(?<=ARG TAILSCALE_VERSION=")[^"]+' tailscale/Dockerfile)
          latest=$(curl -fsSL https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r .tag_name)

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

          if [ "${current}" = "${latest}" ]; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Dockerfile and config.yaml
        if: steps.check.outputs.up-to-date == 'false'
        run: |
          set -euo pipefail

          latest="${{ steps.check.outputs.latest }}"
          latest_semver="${latest#v}"

          sed -i "s/ARG TAILSCALE_VERSION=\"[^\"]*\"/ARG TAILSCALE_VERSION=\"${latest}\"/" tailscale/Dockerfile
          sed -i "s/^version: \".*\"/version: \"${latest_semver}-1\"/" tailscale/config.yaml

      - name: Commit and tag
        if: steps.check.outputs.up-to-date == 'false'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tailscale/Dockerfile tailscale/config.yaml
          git commit -m "Bump Tailscale to ${LATEST}"
          git tag "${LATEST#v}-1"
          git push origin main
          git push origin "${LATEST#v}-1"
